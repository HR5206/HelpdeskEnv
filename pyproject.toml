[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helpdeskenv"
version = "2.1.0"
description = "Multi-agent IT helpdesk environment where Triage, L1, L2, and L3 agents collaborate."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Harish Raghav", email = "harishraghav256@gmail.com" }
]
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "openai==3.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx"
]

[project.urls]
Homepage = "https://huggingface.co/spaces/Harishraghav-05/helpdesk_env"
Repository = "https://github.com/HR5206/HelpdeskEnv"

[project.scripts]
server = "server.app:main"
helpdeskenv-server = "server.app:main"

[project.entry-points."helpdeskenv.graders"]
helpdesk_triage = "graders:grade_triage"
helpdesk_resolution = "graders:grade_efficiency"
helpdesk_kb_contribution = "graders:grade_kb_contribution"

[tool.pyright]
extraPaths = ["."]

[tool.hatch.build.targets.wheel]
packages = ["server", "agents"]

[tool.hatch.build.targets.wheel.force-include]
"baseline_agent.py" = "baseline_agent.py"
"client.py" = "client.py"
"generate_plots.py" = "generate_plots.py"
"graders.py" = "graders.py"
"helpdeskenv_class.py" = "helpdeskenv_class.py"
"heuristics.py" = "heuristics.py"
"inference.py" = "inference.py"
"knowledge_base.py" = "knowledge_base.py"
"models.py" = "models.py"
"run.py" = "run.py"
"server.py" = "server.py"
"tasks.py" = "tasks.py"
